services:
  mysqldb:
    image: mysql:8
    container_name: mysql-dbl
    environment:
      MYSQL_ROOT_PASSWORD: ROOT
      MYSQL_DATABASE: productdb
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - springboot-mysql-net

  backend:
    image: vigneshpoluru1277/2300032475-exam-backend:final
    container_name: springbootlab
    ports:
      - "2025:2000"
    depends_on:
      - mysqldb   
    restart: on-failure
    networks:
      - springboot-mysql-net

  frontend:
    image: vigneshpoluru1277/2300032475-exam-frontend:final
    container_name: reactlab
    ports:
      - "2001:80"
    depends_on:
      - backend
    restart: on-failure
    networks:
      - springboot-mysql-net

volumes:
  mysql_data:

networks:
  springboot-mysql-net:
